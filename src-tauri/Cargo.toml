[package]
name = "tempo"
version = "0.3.8"
description = "A calm, local-first day planner"
authors = ["Tempo"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-scoped-storage = "1.5.1"

# Local patch: upstream 1.5.1 bookmarks a picked folder once and gives up, so an
# iCloud Drive folder with no local directory yet fails with "The file couldn't
# be opened because it doesn't exist". The vendored copy retries after asking
# the file provider to materialize the folder.
[patch.crates-io]
tauri-plugin-scoped-storage = { path = "vendor/tauri-plugin-scoped-storage" }
