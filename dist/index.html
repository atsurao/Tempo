    <meta name="description" content="Tempo — calendar, tasks, notes and focus in one calm place." />
    <title>Tempo</title>
    <script>
      // Apply the saved appearance before first paint so the app never flashes light.
      (function () {
        var resolved = "dark";
        try {
          var raw = localStorage.getItem("tempo-ui");
          var theme = raw ? (JSON.parse(raw).state || {}).theme : "dark";
          if (theme === "light") resolved = "light";
          else if (theme === "system")
            resolved = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
